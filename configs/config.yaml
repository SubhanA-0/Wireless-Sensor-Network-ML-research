# ---------------------------------------------------------------
# Phase 1 configuration: every number that affects results lives here.
# Change a value here, re-run, and the whole pipeline follows.
# ---------------------------------------------------------------

seed: 42                      # master random seed (the paper does not report one)

data:
  raw_path: data/raw/ale_wsn.csv
  features: [anchor_ratio, trans_range, node_density, iterations]
  target: ale
  uci_id: 844                 # UCI ML Repository dataset id

split:
  test_size: 0.20             # paper: 80% train / 20% test
  shuffle: true

preprocessing:
  scaler: minmax              # paper: Min-Max scaling (fit on TRAIN only, inside the pipeline)

cv:
  folds: 5                    # paper: 5-fold cross-validation
  scoring: neg_mean_squared_error   # paper: neg_mean_squared_error

# Random Forest hyperparameter ranges, taken from the paper's Table 2.
# The paper gives only the RANGES, so the exact grid points below are our choice.
search_space:
  n_estimators: [10, 50, 100, 200, 400]      # paper range: 10-400
  max_depth: [null, 5, 10, 15, 20]           # paper: None, 5, 10, 15, 20
  min_samples_split: [2, 5, 10, 15]          # paper range: 2-15
  min_samples_leaf: [1, 2, 4, 8]             # paper range: 1-8

# Budgets. Grid Search tries everything (5*5*4*4 = 400 combos).
# Random Search and Bayesian Optimization get the SAME number of trials so the comparison is fair.
budget:
  random_search_trials: 50
  bayesian_trials: 50

# Seed-robustness experiment (scripts/04_seed_robustness.py):
# repeat the whole split -> tune -> test pipeline with different seeds.
robustness:
  n_seeds: 5

paths:
  figures: results/figures
  tables: results/tables
